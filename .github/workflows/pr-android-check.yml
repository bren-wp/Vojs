name: VOJS pull request checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android screenshot automation before Gradle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_emulator_boot.py
          python3 scripts/test_theme_default.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -1)"
          fi
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;35.0.0"
      - name: Build Android APK and AAB
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintDebug :app:lintRelease
      - name: Verify release permissions and 16 KB native-library constraints
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "sdkVersion:'24'"
          "$BT/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "targetSdkVersion:'36'"
          if "$BT/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q 'android.permission.INTERNET'; then
            echo "::error::Unexpected internet permission in merged APK"
            exit 1
          fi
          python3 scripts/check_native_alignment.py \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify source logo and clean VOJS user interface
        shell: bash
        run: |
          set -euo pipefail
          cmp branding/logotip/logotip-svijetla-podloga.png app/src/main/res/drawable-nodpi/vojs_logo_light.png
          cmp branding/logotip/logotip-bijeli-prozirni.png app/src/main/res/drawable-nodpi/vojs_logo_dark.png
          cmp branding/android/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          if grep -E 'Bez računa|Bez VOJS servera|brendigo.com|BRENDIGO' app/src/main/java/com/brendigo/vojs/MainActivity.kt; then
            echo "::error::Unexpected branding/technical text is present in VOJS UI."
            exit 1
          fi
      - name: Check Android UI coordinate parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("scripts/capture_screenshots.py").read_text()
          assert 're.findall(r"[0-9]+", node.attrib.get("bounds", ""))' in source, "Wrong UI bounds matcher"
          assert re.findall(r"[0-9]+", "[393,1655][687,1949]") == ["393","1655","687","1949"]
          PY
      - name: Original VOJS splash correctness
        shell: bash
        run: |
          set -euo pipefail
          cmp branding/pocetni-zaslon/pocetni-zaslon-svijetli-1080x2400.png app/src/main/res/drawable-nodpi/vojs_splash_light.png
          cmp branding/pocetni-zaslon/pocetni-zaslon-tamni-1080x2400.png app/src/main/res/drawable-nodpi/vojs_splash_dark.png
          grep -q 'delay(2500L)' app/src/main/java/com/brendigo/vojs/MainActivity.kt
          grep -q 'ContentScale.Fit' app/src/main/java/com/brendigo/vojs/VojsBrandedSplash.kt
      - name: Security boundary checks
        shell: bash
        run: |
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -E 'FirebaseApp|Retrofit|OkHttpClient|http://' app/src/main/java
