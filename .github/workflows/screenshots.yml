name: Capture real Android screenshots

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/capture_screenshots.py'
      - 'scripts/audit_splash_pixels.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK and build installable APK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -1)"
          fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
          gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot emulator and capture actual screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 -m pip install --disable-pip-version-check "Pillow>=11,<13"
            python3 scripts/capture_screenshots.py
            python3 scripts/audit_splash_pixels.py
      - name: Archive real screenshots and diagnostics even on failed UI tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vojs-real-android-screenshots
          path: docs/screenshots/
          if-no-files-found: warn
      - name: Commit genuine captures for README and Google Play review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::notice::Screenshots archived, but not committed: newer main is available."
            exit 0
          fi
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "docs: genuine Android emulator screenshots [skip ci]"
            git push origin HEAD:main
          fi
