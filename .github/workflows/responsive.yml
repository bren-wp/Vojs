name: VOJS multi-device Android smoke

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/verify_responsive.py'
      - '.github/workflows/responsive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-emulator-screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile_name: small-phone-api29
            avd_profile: pixel_2
            android_api: 29
            font_scale: "1.25"
          - profile_name: standard-phone-api35
            avd_profile: pixel_6
            android_api: 35
            font_scale: "1.0"
          - profile_name: tablet-api35
            avd_profile: pixel_c
            android_api: 35
            font_scale: "1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Prepare SDK and VOJS debug APK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -1)"
          fi
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;35.0.0"
          gradle --no-daemon :app:assembleDebug
      - name: KVM support
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture real phone/tablet flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.android_api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.avd_profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -cores 2 -memory 3072
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/verify_responsive.py --profile ${{ matrix.profile_name }} --font-scale ${{ matrix.font_scale }} --fresh-install
      - name: Archive genuine device screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vojs-${{ matrix.profile_name }}-real-screens
          path: docs/responsive/${{ matrix.profile_name }}/
          if-no-files-found: warn
