name: Android build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
      - "docs/play-store-assets/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vojs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;35.0.0"
      - name: Prepare optional production key
        env:
          VOJS_KEYSTORE_BASE64: ${{ secrets.VOJS_KEYSTORE_BASE64 }}
          VOJS_STORE_PASSWORD: ${{ secrets.VOJS_STORE_PASSWORD }}
          VOJS_KEY_ALIAS: ${{ secrets.VOJS_KEY_ALIAS }}
          VOJS_KEY_PASSWORD: ${{ secrets.VOJS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$VOJS_KEYSTORE_BASE64" && -n "$VOJS_STORE_PASSWORD" && -n "$VOJS_KEY_ALIAS" && -n "$VOJS_KEY_PASSWORD" ]]; then
            printf '%s' "$VOJS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vojs-release.jks"
            echo "VOJS_KEYSTORE_PATH=$RUNNER_TEMP/vojs-release.jks" >> "$GITHUB_ENV"
            echo "VOJS_STORE_PASSWORD=$VOJS_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "VOJS_KEY_ALIAS=$VOJS_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "VOJS_KEY_PASSWORD=$VOJS_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          fi
      - name: Verify Play privacy, offline recording, actual store media and marketing copy
        run: |
          set -euo pipefail
          python3 scripts/test_play_readiness.py
          python3 scripts/test_offline_contract.py
          python3 scripts/test_play_assets.py
          python3 scripts/test_marketing_readme.py
      - name: Build debug APK, release APK and release AAB
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease \
            -PvojsVersionCode=${{ github.run_number }} \
            -PvojsVersionName=1.0.${{ github.run_number }}
      - name: Verify APK target, permissions, native libs and optional signing
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "sdkVersion:'24'"
          "$BT/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "targetSdkVersion:'36'"
          "$BT/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q "android.permission.RECORD_AUDIO"
          "$BT/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q "android.permission.INTERNET"
          if [[ "${SIGNING_READY:-false}" == "true" ]]; then
            RELEASE_FILE="app/build/outputs/apk/release/app-release.apk"
          else
            RELEASE_FILE="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          python3 scripts/check_native_alignment.py \
            app/build/outputs/apk/debug/app-debug.apk \
            "$RELEASE_FILE" \
            app/build/outputs/bundle/release/app-release.aab
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$BT/zipalign" -c -P 16 -v 4 "$RELEASE_FILE"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > /dev/null
          if [[ "${SIGNING_READY:-false}" == "true" ]]; then
            "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > /dev/null
            jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab > /dev/null
          fi
      - name: Archive all build outputs
        uses: actions/upload-artifact@v4
        with:
          name: vojs-android-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Report missing Play upload signing
        if: env.SIGNING_READY != 'true'
        shell: bash
        run: |
          echo "::warning::No production signing secrets. Only CI test artifacts were created. No GitHub production release will be published."
          echo "### Production release not published" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the private VOJS upload signing secrets, then run the release workflow after passing all quality gates. Unsigned builds are **not** Play Store releases." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for successful post-merge screenshot, emulator and web QA
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          QA_SHA="$GITHUB_SHA"
          # The screenshot workflow may append a media-only [skip ci] commit
          # after the verified merge. Manual dispatch from that commit should
          # check its tested source parent, never bypass the quality gates.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            last_message="$(git log -1 --format=%B)"
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            other_changes="$(printf '%s\n' "$changed_files" | grep -Ev '^(docs/screenshots/|docs/play-store-assets/)' || true)"
            if [[ "$last_message" == *"[skip ci]"* && -z "$other_changes" ]]; then
              QA_SHA="$(git rev-parse HEAD^)"
            fi
          fi
          echo "Checking post-merge workflows for source commit $QA_SHA"
          for workflow in "VOJS multi-device Android smoke" "Capture real Android screenshots" "VOJS full web visual matrix"; do
            passed=false
            for attempt in $(seq 1 60); do
              result=$(gh run list --workflow "$workflow" --commit "$QA_SHA" --limit 10 --json status,conclusion --jq '
                if length == 0 then "missing"
                elif any(.[]; .conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") then "failed"
                elif all(.[]; .status == "completed" and .conclusion == "success") then "success"
                else "pending" end
              ')
              if [[ "$result" == success ]]; then
                passed=true
                break
              fi
              if [[ "$result" == failed ]]; then
                echo "::error::$workflow failed on $QA_SHA. Not publishing."
                exit 1
              fi
              # A new push can schedule the main workflows after this job starts.
              # A missing run is not proof of success: keep waiting, then fail.
              sleep 30
            done
            if [[ "$passed" != true ]]; then
              echo "::error::$workflow did not pass within 30 minutes. Not publishing."
              exit 1
            fi
            echo "PASS: $workflow for $QA_SHA"
          done
      - name: Publish signed and verified GitHub Release
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"
          DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$DEBUG" && test -s "$APK" && test -s "$AAB"
          mkdir -p dist
          cp "$DEBUG" "dist/VOJS-$TAG-debug.apk"
          cp "$APK" "dist/VOJS-$TAG-release.apk"
          cp "$AAB" "dist/VOJS-$TAG-release.aab"
          gh release create "$TAG" "dist/VOJS-$TAG-debug.apk" "dist/VOJS-$TAG-release.apk" "dist/VOJS-$TAG-release.aab" \
            --title "VOJS $TAG" --target "${{ github.sha }}" \
            --notes "Verified Android release with signed APK/AAB, Android lint, genuine-screen emulator and offline smoke, and WebRTC browser checks. Google Play Console approval and Data safety submission are separate publisher steps. See docs/PLAY-CONSOLE-SUBMISSION.md."
          echo "Published signed $TAG after required post-merge checks" >> "$GITHUB_STEP_SUMMARY"
